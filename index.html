<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Jeevika! ✨</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
      body { font-family: 'Plus Jakarta Sans', sans-serif; }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .animate-float { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="bg-rose-50 text-gray-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useCallback } = React;

      // Icons
      const Lock = ({className}) => <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
      const Heart = ({className}) => <svg className={className} fill="currentColor" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.04 3 5.5l7 7Z"/></svg>;
      const Camera = ({className}) => <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>;
      const Send = ({className}) => <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>;
      const KeyRound = ({className}) => <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"/><circle cx="16.5" cy="7.5" r=".5"/></svg>;
      const Sparkles = ({className}) => <svg className={className} fill="currentColor" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>;
      const Cake = ({className}) => <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v2"/><path d="M12 8v2"/><path d="M17 8v2"/><path d="M12 4v2"/></svg>;

      const NAME = "Jeevika";
      const CAPTIONS = [
        "Glowing, even without the diya ✨",
        "Pink, gold and pure sparkle 💖",
        "Calm eyes, soft smile, easy day 🌸",
        "Mirror check: curls on point 🪞",
        "Brighter than all the festival lights 🌟",
        "Golden hour found you ☀️",
        "Marigolds and that curious look 🌼",
        "Dressed up and unstoppable 💃",
        "Twirl-worthy, mirror approved 🎀",
        "Fairy lights, blue night, that smile 🌙"
      ];

      const PHOTOS = [
        "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=60",
        "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&auto=format&fit=crop&q=60",
        "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500&auto=format&fit=crop&q=60",
        "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=500&auto=format&fit=crop&q=60",
        "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500&auto=format&fit=crop&q=60",
        "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500&auto=format&fit=crop&q=60",
        "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=500&auto=format&fit=crop&q=60",
        "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=500&auto=format&fit=crop&q=60",
        "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=500&auto=format&fit=crop&q=60",
        "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&auto=format&fit=crop&q=60"
      ];

      function App() {
        const [unlocked, setUnlocked] = useState(false);
        const [passcode, setPasscode] = useState("");
        const [activeTab, setActiveTab] = useState("gallery");
        const [wish, setWish] = useState("");
        const [wishesList, setWishesList] = useState([
          "Happy Birthday Jeevika! Wishing you all the success, joy, and endless laughter.",
          "May your year be filled with golden light, amazing adventures, and wonderful memories!"
        ]);
        const [selectedPhoto, setSelectedPhoto] = useState(null);

        const handleUnlock = (e) => {
          e.preventDefault();
          if (passcode === "1511" || passcode.toLowerCase() === "jeevika" || passcode === "") {
            setUnlocked(true);
          } else {
            alert("Incorrect passcode! Try her birthday (DDMM, e.g. 1511) or name.");
          }
        };

        const addWish = (e) => {
          e.preventDefault();
          if (!wish.trim()) return;
          setWishesList([wish, ...wishesList]);
          setWish("");
        };

        if (!unlocked) {
          return (
            <div className="flex items-center justify-center min-h-screen p-4 bg-gradient-to-br from-pink-100 via-rose-100 to-amber-50">
              <div className="bg-white/90 backdrop-blur-md p-8 rounded-3xl shadow-2xl max-w-md w-full text-center border border-pink-200 animate-float">
                <div className="w-20 h-20 bg-gradient-to-tr from-pink-500 to-rose-400 text-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-pink-200">
                  <Lock className="w-10 h-10" />
                </div>
                <h1 className="text-2xl font-bold text-gray-800 mb-2">Special Delivery for {NAME}</h1>
                <p className="text-gray-500 text-sm mb-6">Enter passcode (DDMM e.g. 1511 or name) to unlock your birthday surprise!</p>
                <form onSubmit={handleUnlock} className="space-y-4">
                  <div className="relative">
                    <KeyRound className="absolute left-4 top-3.5 w-5 h-5 text-pink-400" />
                    <input
                      type="password"
                      value={passcode}
                      onChange={(e) => setPasscode(e.target.value)}
                      placeholder="Passcode..."
                      className="w-full pl-12 pr-4 py-3 bg-pink-50/50 border border-pink-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-pink-400 text-center tracking-widest font-semibold text-lg"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full py-3.5 bg-gradient-to-r from-pink-500 to-rose-500 text-white font-semibold rounded-2xl shadow-md hover:opacity-95 transition transform active:scale-95"
                  >
                    Unlock Magic ✨
                  </button>
                </form>
                <div className="mt-4 text-xs text-gray-400">Hint: Type "1511" or "jeevika"</div>
              </div>
            </div>
          );
        }

        return (
          <div className="min-h-screen bg-gradient-to-br from-rose-50 via-pink-50 to-amber-50 pb-16">
            <header className="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-pink-100 shadow-sm">
              <div className="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
                <div className="flex items-center space-x-2">
                  <Sparkles className="w-6 h-6 text-pink-500 animate-pulse" />
                  <span className="font-bold text-xl bg-gradient-to-r from-pink-600 to-rose-600 bg-clip-text text-transparent">
                    Happy Birthday, {NAME}! 🎉
                  </span>
                </div>
                <nav className="flex space-x-2">
                  <button
                    onClick={() => setActiveTab("gallery")}
                    className={`px-4 py-2 rounded-xl text-sm font-medium transition ${activeTab === "gallery" ? "bg-pink-500 text-white shadow-md shadow-pink-200" : "text-gray-600 hover:bg-pink-100/50"}`}
                  >
                    Gallery 📸
                  </button>
                  <button
                    onClick={() => setActiveTab("wishes")}
                    className={`px-4 py-2 rounded-xl text-sm font-medium transition ${activeTab === "wishes" ? "bg-pink-500 text-white shadow-md shadow-pink-200" : "text-gray-600 hover:bg-pink-100/50"}`}
                  >
                    Wishes Wall 💌
                  </button>
                </nav>
              </div>
            </header>

            <main className="max-w-4xl mx-auto px-4 py-8">
              {activeTab === "gallery" && (
                <div>
                  <div className="text-center mb-8">
                    <h2 className="text-3xl font-bold text-gray-800 mb-2">Memory Lane 📸</h2>
                    <p className="text-gray-500">A collection of gorgeous moments, smiles, and celebrations.</p>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                    {PHOTOS.map((photo, idx) => (
                      <div 
                        key={idx} 
                        onClick={() => setSelectedPhoto(photo)}
                        className="bg-white rounded-3xl overflow-hidden shadow-md border border-pink-100 hover:shadow-xl transition group cursor-pointer"
                      >
                        <div className="h-64 overflow-hidden relative">
                          <img src={photo} alt={`Memory ${idx+1}`} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                          <div className="absolute top-3 right-3 bg-white/80 backdrop-blur-sm p-1.5 rounded-full text-pink-500 shadow">
                            <Heart className="w-4 h-4 fill-pink-500" />
                          </div>
                        </div>
                        <div className="p-4">
                          <p className="text-gray-700 text-sm font-medium italic">"{CAPTIONS[idx % CAPTIONS.length]}"</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === "wishes" && (
                <div className="max-w-xl mx-auto">
                  <div className="text-center mb-8">
                    <h2 className="text-3xl font-bold text-gray-800 mb-2">Birthday Wishes Wall 💌</h2>
                    <p className="text-gray-500">Leave a sweet note or birthday wish for {NAME}!</p>
                  </div>

                  <form onSubmit={addWish} className="bg-white p-6 rounded-3xl shadow-md border border-pink-100 mb-8 space-y-4">
                    <textarea
                      rows="3"
                      value={wish}
                      onChange={(e) => setWish(e.target.value)}
                      placeholder="Write your heartfelt wish here..."
                      className="w-full p-4 bg-pink-50/50 border border-pink-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm"
                    ></textarea>
                    <button
                      type="submit"
                      className="w-full py-3 bg-gradient-to-r from-pink-500 to-rose-500 text-white font-semibold rounded-2xl shadow-md hover:opacity-95 transition flex items-center justify-center space-x-2"
                    >
                      <Send className="w-4 h-4" />
                      <span>Send Wish</span>
                    </button>
                  </form>

                  <div className="space-y-4">
                    {wishesList.map((w, idx) => (
                      <div key={idx} className="bg-white p-5 rounded-2xl shadow-sm border border-pink-100 flex items-start space-x-3">
                        <div className="w-10 h-10 rounded-full bg-pink-100 flex items-center justify-center text-pink-500 font-bold shrink-0">
                          {idx + 1}
                        </div>
                        <p className="text-gray-700 text-sm pt-2">{w}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>

            {selectedPhoto && (
              <div 
                className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4"
                onClick={() => setSelectedPhoto(null)}
              >
                <div className="bg-white rounded-3xl overflow-hidden max-w-lg w-full p-4 relative shadow-2xl">
                  <img src={selectedPhoto} alt="Zoomed memory" className="w-full h-96 object-cover rounded-2xl mb-4" />
                  <button 
                    onClick={() => setSelectedPhoto(null)}
                    className="w-full py-2.5 bg-pink-500 text-white font-semibold rounded-xl shadow hover:bg-pink-600 transition"
                  >
                    Close
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
