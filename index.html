    ];

    function App() {
      const [photoIndex, setPhotoIndex] = useState(0);
      const [showCard, setShowCard] = useState(false);
      const [hearts, setHearts] = useState([]);
      const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });

      // Countdown logic
      useEffect(() => {
        const calculateTime = () => {
          const now = new Date();
          let year = now.getFullYear();
          let bday = new Date(year, BDAY_MONTH, BDAY_DAY, 0, 0, 0);
          if (now > bday) {
            bday = new Date(year + 1, BDAY_MONTH, BDAY_DAY, 0, 0, 0);
          }
          const diff = bday - now;
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const minutes = Math.floor((diff / 1000 / 60) % 60);
          const seconds = Math.floor((diff / 1000) % 60);
          setTimeLeft({ days, hours, minutes, seconds });
        };
        calculateTime();
        const timer = setInterval(calculateTime, 1000);
        return () => clearInterval(timer);
      }, []);

      // Floating hearts effect
      const triggerHeart = (e) => {
        const id = Date.now();
        const x = e.clientX || window.innerWidth / 2;
        const y = e.clientY || window.innerHeight / 2;
        setHearts((prev) => [...prev, { id, x, y }]);
        setTimeout(() => {
          setHearts((prev) => prev.filter((h) => h.id !== id));
        }, 1000);
      };

      const nextPhoto = () => setPhotoIndex((prev) => (prev + 1) % PHOTOS.length);
      const prevPhoto = () => setPhotoIndex((prev) => (prev - 1 + PHOTOS.length) % PHOTOS.length);

      return (
        <div className="min-h-screen bg-slate-950 text-pink-100 flex flex-col items-center justify-center p-4 relative overflow-hidden" onClick={triggerHeart}>
          {/* Floating Hearts */}
          {hearts.map((h) => (
            <span
              key={h.id}
              className="absolute text-pink-500 text-2xl pointer-events-none animate-ping"
              style={{ left: h.x - 12, top: h.y - 12 }}
            >
              ❤️
            </span>
          ))}

          {/* Main Container */}
          <div className="max-w-md w-full bg-slate-900/80 backdrop-blur-md border border-pink-500/20 rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center space-y-6">
            
            {/* Header */}
            <div>
              <span className="inline-block bg-pink-500/10 text-pink-400 text-xs px-3 py-1 rounded-full uppercase tracking-widest font-semibold mb-2">
                Special Day
              </span>
              <h1 className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-amber-300">
                Happy Birthday, {NAME}! ✨
              </h1>
            </div>

            {/* Photo Gallery Frame */}
            <div className="relative w-full aspect-[4/5] rounded-2xl overflow-hidden shadow-lg border-2 border-pink-500/30 group">
              <img
                src={PHOTOS[photoIndex]}
                alt={CAPTIONS[photoIndex]}
                className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
              />
              <div className="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent flex flex-col justify-end p-4">
                <p className="text-sm font-medium text-pink-200">
                  "{CAPTIONS[photoIndex]}"
                </p>
                <div className="flex justify-between items-center mt-3">
                  <button
                    onClick={(e) => { e.stopPropagation(); prevPhoto(); }}
                    className="bg-slate-900/60 hover:bg-pink-600 text-white px-3 py-1 rounded-full text-xs transition"
                  >
                    ← Prev
                  </button>
                  <span className="text-xs text-slate-400 font-mono">
                    {photoIndex + 1} / {PHOTOS.length}
                  </span>
                  <button
                    onClick={(e) => { e.stopPropagation(); nextPhoto(); }}
                    className="bg-slate-900/60 hover:bg-pink-600 text-white px-3 py-1 rounded-full text-xs transition"
                  >
                    Next →
                  </button>
                </div>
              </div>
            </div>

            {/* Countdown Box */}
            <div className="w-full bg-slate-950/50 rounded-xl p-4 border border-pink-500/10">
              <p className="text-xs text-slate-400 mb-2 uppercase tracking-wider">Countdown to next birthday</p>
              <div className="grid grid-cols-4 gap-2 text-center font-mono">
                <div className="bg-slate-900 p-2 rounded-lg">
                  <span className="block text-xl font-bold text-pink-400">{timeLeft.days}</span>
                  <span className="text-[10px] text-slate-500">Days</span>
                </div>
                <div className="bg-slate-900 p-2 rounded-lg">
                  <span className="block text-xl font-bold text-pink-400">{timeLeft.hours}</span>
                  <span className="text-[10px] text-slate-500">Hours</span>
                </div>
                <div className="bg-slate-900 p-2 rounded-lg">
                  <span className="block text-xl font-bold text-pink-400">{timeLeft.minutes}</span>
                  <span className="text-[10px] text-slate-500">Mins</span>
                </div>
                <div className="bg-slate-900 p-2 rounded-lg">
                  <span className="block text-xl font-bold text-pink-400">{timeLeft.seconds}</span>
                  <span className="text-[10px] text-slate-500">Secs</span>
                </div>
              </div>
            </div>

            {/* Secret Card Toggle */}
            <button
              onClick={(e) => { e.stopPropagation(); setShowCard(!showCard); }}
              className="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-medium py-3 rounded-xl shadow-lg transition transform active:scale-95"
            >
              {showCard ? "Hide Surprise Message 💌" : "Open Surprise Message 💌"}
            </button>

            {showCard && (
              <div className="w-full bg-pink-950/30 border border-pink-500/30 p-4 rounded-xl text-left text-sm space-y-2 animate-fadeIn">
                <p className="text-pink-300 font-semibold">Dearest Jeevika,</p>
                <p className="text-pink-100/90 leading-relaxed">
                  May this year bring you as much joy, laughter, and sparkle as you bring into the lives of everyone around you. Keep glowing and shining bright! ✨🎂
                </p>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
